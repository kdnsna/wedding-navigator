<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚礼导航 - 我们的婚礼</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="page-container">
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-content">
        <div class="header-title">
          <span>💍</span>
          <span>婚礼导航</span>
        </div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 英雄区域 -->
      <div class="home-hero">
        <div class="couple-names" id="coupleNames">加载中...</div>
        <div class="wedding-date-display" id="weddingDate">2026年11月14日</div>
        <div class="countdown" id="countdown">计算中...</div>
        <div class="countdown-label">距离婚礼还有</div>
      </div>

      <!-- 功能入口 -->
      <div class="feature-grid">
        <a href="invitation.html" class="feature-card">
          <div class="feature-icon">📜</div>
          <div class="feature-title">婚书请柬</div>
          <div class="feature-desc">精美请柬模板<br>支持图片导出</div>
        </a>
        
        <a href="route.html" class="feature-card">
          <div class="feature-icon">🗺️</div>
          <div class="feature-title">婚礼路书</div>
          <div class="feature-desc">多点路线串联<br>一键导航</div>
        </a>
        
        <a href="timeline.html" class="feature-card">
          <div class="feature-icon">⏰</div>
          <div class="feature-title">流程时间线</div>
          <div class="feature-desc">婚礼当天安排<br>角色专属视图</div>
        </a>
        
        <a href="#" class="feature-card" onclick="alert('敬请期待！'); return false;">
          <div class="feature-icon">👥</div>
          <div class="feature-title">宾客管理</div>
          <div class="feature-desc">宾客名单<br>RSVP统计</div>
        </a>
      </div>

      <!-- 婚礼信息卡片 -->
      <div class="card" style="margin-top: 1.5rem;">
        <div class="card-body">
          <h3 class="card-title" style="color: var(--color-primary);">💒 婚礼信息</h3>
          <div style="margin-top: 1rem;">
            <p style="margin-bottom: 0.5rem;">
              <strong>📅 日期：</strong>
              <span id="weddingDateInfo">2026年11月14日 星期六</span>
            </p>
            <p style="margin-bottom: 0.5rem;">
              <strong>⏰ 时间：</strong>
              <span>12:00</span>
            </p>
            <p>
              <strong>📍 地点：</strong>
              <span id="venueInfo">北京市朝阳区天辰东路7号</span>
            </p>
          </div>
        </div>
      </div>

      <!-- 温馨提醒 -->
      <div class="card" style="margin-top: 1rem;">
        <div class="card-body">
          <h3 class="card-title" style="color: var(--color-gold);">💡 温馨提醒</h3>
          <ul style="margin-top: 1rem; color: var(--color-gray); font-size: 0.875rem; padding-left: 1.25rem;">
            <li style="margin-bottom: 0.5rem;">请提前规划好出行路线，避免迟到</li>
            <li style="margin-bottom: 0.5rem;">婚礼当天记得带好随身物品</li>
            <li style="margin-bottom: 0.5rem;">保持手机畅通，方便联系</li>
            <li>祝您享受美好的婚礼时光！</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="invitation.html" class="nav-item">
        <span class="nav-icon">📜</span>
        <span>请柬</span>
      </a>
      <a href="route.html" class="nav-item">
        <span class="nav-icon">🗺️</span>
        <span>路书</span>
      </a>
      <a href="timeline.html" class="nav-item">
        <span class="nav-icon">⏰</span>
        <span>时间线</span>
      </a>
    </nav>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // 首页特定初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 更新婚礼信息
      const config = window.ConfigManager.getConfig();
      if (config) {
        const weddingVenue = config.venues.find(v => v.type === 'venue');
        document.getElementById('weddingDateInfo').textContent = 
          `${config.wedding.date} ${config.wedding.weekday}`;
        if (weddingVenue) {
          document.getElementById('venueInfo').textContent = weddingVenue.address;
        }
      }
    });
  </script>
</body>
</html>
