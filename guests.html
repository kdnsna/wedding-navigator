<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宾客管理 - 婚礼导航</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="page-container">
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-content">
        <button class="header-back" onclick="history.back()">←</button>
        <div class="header-title">
          <span>👥</span>
          <span>宾客管理</span>
        </div>
        <div style="width: 40px;"></div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 统计卡片 -->
      <section class="stats-card" style="margin-bottom: 1.5rem;">
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">总邀请</div>
          </div>
          <div class="stat-item">
            <div class="stat-number highlight" id="statAttending">0</div>
            <div class="stat-label">已确认出席</div>
          </div>
          <div class="stat-item">
            <div class="stat-number warning" id="statPending">0</div>
            <div class="stat-label">待回复</div>
          </div>
        </div>
        <div class="stats-footer">
          出席率 <strong id="statRate">0%</strong> · 预计 <strong id="statPeople">0</strong> 人到场
        </div>
      </section>

      <!-- 操作按钮 -->
      <section style="display: flex; gap: 0.75rem; margin-bottom: 1.5rem;">
        <button class="btn btn-primary" style="flex: 1;" onclick="showAddGuestModal()">
          ➕ 添加宾客
        </button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="showQRCode()">
          📱 邀请二维码
        </button>
      </section>

      <!-- 筛选标签 -->
      <section style="margin-bottom: 1rem;">
        <div class="role-filter" id="guestFilter">
          <button class="role-filter-btn active" data-filter="all">全部</button>
          <button class="role-filter-btn" data-filter="attending">确认出席</button>
          <button class="role-filter-btn" data-filter="declined">无法出席</button>
          <button class="role-filter-btn" data-filter="pending">待回复</button>
        </div>
      </section>

      <!-- 宾客列表 -->
      <section>
        <h3 style="font-weight: 600; margin-bottom: 1rem;">📋 宾客名单</h3>
        <div id="guestList">
          <div style="text-align: center; padding: 2rem; color: #999;">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">👥</div>
            <div>暂无宾客，请点击上方按钮添加</div>
          </div>
        </div>
      </section>

      <!-- 批量导入提示 -->
      <section class="card" style="margin-top: 1.5rem;">
        <div class="card-body">
          <h3 class="card-title" style="color: var(--color-gold);">💡 使用提示</h3>
          <ul style="margin-top: 1rem; color: var(--color-gray); font-size: 0.875rem; padding-left: 1.25rem;">
            <li style="margin-bottom: 0.5rem;">点击「添加宾客」手动录入宾客信息</li>
            <li style="margin-bottom: 0.5rem;">点击「邀请二维码」生成 RSVP 分享页面</li>
            <li style="margin-bottom: 0.5rem;">宾客可通过二维码填写是否出席及人数</li>
            <li>所有数据保存在本地，不会上传服务器</li>
          </ul>
        </div>
      </section>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="invitation.html" class="nav-item">
        <span class="nav-icon">📜</span>
        <span>请柬</span>
      </a>
      <a href="route.html" class="nav-item">
        <span class="nav-icon">🗺️</span>
        <span>路书</span>
      </a>
      <a href="guests.html" class="nav-item active">
        <span class="nav-icon">👥</span>
        <span>宾客</span>
      </a>
      <a href="timeline.html" class="nav-item">
        <span class="nav-icon">⏰</span>
        <span>时间线</span>
      </a>
    </nav>
  </div>

  <!-- 添加/编辑宾客弹窗 -->
  <div class="modal-overlay" id="guestModal">
    <div class="modal-content" style="width: 90%; max-width: 500px;">
      <div class="modal-header">
        <h3 id="modalTitle">添加宾客</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="guestForm" onsubmit="saveGuest(event)">
          <input type="hidden" id="guestId">
          <div style="display: grid; gap: 1rem;">
            <div>
              <label class="editor-label">姓名 *</label>
              <input type="text" id="guestName" class="editor-input" required placeholder="宾客姓名">
            </div>
            <div>
              <label class="editor-label">电话</label>
              <input type="tel" id="guestPhone" class="editor-input" placeholder="联系电话">
            </div>
            <div>
              <label class="editor-label">关系</label>
              <select id="guestRelation" class="editor-input">
                <option value="family">家人</option>
                <option value="friend">朋友</option>
                <option value="colleague">同事</option>
                <option value="classmate">同学</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div>
              <label class="editor-label">出席状态</label>
              <select id="guestStatus" class="editor-input">
                <option value="pending">待回复</option>
                <option value="attending">确认出席</option>
                <option value="declined">无法出席</option>
                <option value="maybe">待定</option>
              </select>
            </div>
            <div>
              <label class="editor-label">出席人数（含本人）</label>
              <input type="number" id="guestCount" class="editor-input" min="0" max="10" value="1">
            </div>
            <div>
              <label class="editor-label">饮食偏好</label>
              <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
                  <input type="checkbox" name="diet" value="vegetarian"> 素食
                </label>
                <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
                  <input type="checkbox" name="diet" value="halal"> 清真
                </label>
                <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
                  <input type="checkbox" name="diet" value="noSeafood"> 忌海鲜
                </label>
                <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
                  <input type="checkbox" name="diet" value="noPork"> 忌猪肉
                </label>
              </div>
            </div>
            <div>
              <label class="editor-label">备注</label>
              <textarea id="guestNote" class="editor-input editor-textarea" placeholder="其他需要备注的信息"></textarea>
            </div>
          </div>
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
            <button type="button" class="btn btn-ghost" style="flex: 1;" onclick="closeModal()">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 二维码弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-content" style="width: 90%; max-width: 400px; text-align: center;">
      <div class="modal-header">
        <h3>📱 邀请二维码</h3>
        <button class="modal-close" onclick="closeQRModal()">×</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--color-gray); font-size: 0.875rem; margin-bottom: 1rem;">
          宾客扫描二维码即可填写 RSVP 回执
        </p>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 1rem 0;"></div>
        <p style="color: var(--color-gray); font-size: 0.75rem; margin-top: 1rem;">
          二维码内容为本页面链接，宾客可在此页面提交出席信息
        </p>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/export.js"></script>
  <script src="./js/guests.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
