<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚书请柬 - 婚礼导航</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="page-container">
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-content">
        <button class="header-back" onclick="history.back()">←</button>
        <div class="header-title">
          <span>📜</span>
          <span>婚书请柬</span>
        </div>
        <div style="width: 40px;"></div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 模板选择 -->
      <section class="editor-section">
        <label class="editor-label">选择模板风格</label>
        <div class="template-grid">
          <div class="card template-card selected" data-template="traditional">
            <div style="height: 120px; background: linear-gradient(135deg, #8B0000, #C41E3A); display: flex; align-items: center; justify-content: center;">
              <span style="font-size: 3rem; color: #FFD700;">囍</span>
            </div>
            <div class="card-body" style="padding: 1rem;">
              <div class="card-title" style="font-size: 1rem;">中国传统红金风</div>
              <div class="card-text" style="font-size: 0.75rem;">经典喜庆 龙凤呈祥</div>
            </div>
          </div>
          
          <div class="card template-card" data-template="modern">
            <div style="height: 120px; background: linear-gradient(180deg, #FAFAFA, #F0F0F0); display: flex; align-items: center; justify-content: center;">
              <span style="font-size: 1.5rem; color: #2C3E50;">Wedding</span>
            </div>
            <div class="card-body" style="padding: 1rem;">
              <div class="card-title" style="font-size: 1rem;">现代简约风</div>
              <div class="card-text" style="font-size: 0.75rem;">简洁大方 现代时尚</div>
            </div>
          </div>
          
          <div class="card template-card" data-template="minimal">
            <div style="height: 120px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 1px solid #eee;">
              <span style="font-size: 1rem; color: #000; letter-spacing: 0.3em;">WEDDING</span>
            </div>
            <div class="card-body" style="padding: 1rem;">
              <div class="card-title" style="font-size: 1rem;">极简高级风</div>
              <div class="card-text" style="font-size: 0.75rem;">极致简约 高端大气</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 婚书编辑 -->
      <section class="editor-section">
        <label class="editor-label">编辑新人信息</label>
        <div style="display: grid; gap: 1rem;">
          <input type="text" id="groomName" class="editor-input" placeholder="新郎姓名" value="张浩然">
          <input type="text" id="brideName" class="editor-input" placeholder="新娘姓名" value="李婉清">
        </div>
      </section>

      <!-- 婚礼信息编辑 -->
      <section class="editor-section">
        <label class="editor-label">编辑婚礼信息</label>
        <div style="display: grid; gap: 1rem;">
          <div>
            <label style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 0.25rem; display: block;">婚礼日期</label>
            <input type="date" id="weddingDateInput" class="editor-input">
          </div>
          <div>
            <label style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 0.25rem; display: block;">仪式时间</label>
            <input type="time" id="weddingTimeInput" class="editor-input">
          </div>
          <div>
            <label style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 0.25rem; display: block;">婚礼地点</label>
            <input type="text" id="weddingVenueInput" class="editor-input" placeholder="婚礼举办地点">
          </div>
          <div>
            <label style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 0.25rem; display: block;">详细地址</label>
            <input type="text" id="weddingAddressInput" class="editor-input" placeholder="详细地址">
          </div>
        </div>
      </section>

      <!-- 婚书文案选择 -->
      <section class="editor-section">
        <label class="editor-label">选择婚书文案</label>
        <div class="wish-list" id="wishList">
          <!-- 由JS动态渲染 -->
        </div>
      </section>

      <!-- 婚书预览 -->
      <section class="editor-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <label class="editor-label" style="margin-bottom: 0;">预览效果</label>
        </div>
        <div class="card" style="overflow: hidden;">
          <div id="invitationPreview" class="invitation-preview">
            <!-- 预览内容 -->
          </div>
        </div>
      </section>

      <!-- 导出按钮 -->
      <section style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button id="exportPng" class="btn btn-primary" style="flex: 1;">
          📷 导出图片
        </button>
        <button id="exportPdf" class="btn btn-secondary" style="flex: 1;">
          📄 导出PDF
        </button>
      </section>

      <!-- 分享按钮 -->
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button class="btn btn-ghost" style="flex: 1;" onclick="ExportManager.copyShareLink()">
          🔗 复制链接
        </button>
        <button class="btn btn-ghost" style="flex: 1;" onclick="ExportManager.showShareQRCode()">
          📱 分享二维码
        </button>
      </div>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="invitation.html" class="nav-item active">
        <span class="nav-icon">📜</span>
        <span>请柬</span>
      </a>
      <a href="route.html" class="nav-item">
        <span class="nav-icon">🗺️</span>
        <span>路书</span>
      </a>
      <a href="guests.html" class="nav-item">
        <span class="nav-icon">👥</span>
        <span>宾客</span>
      </a>
      <a href="timeline.html" class="nav-item">
        <span class="nav-icon">⏰</span>
        <span>时间线</span>
      </a>
    </nav>
  </div>

  <!-- 二维码分享弹窗 -->
  <div class="modal-overlay" id="shareQRModal">
    <div class="modal-content" style="width: 90%; max-width: 400px; text-align: center;">
      <div class="modal-header">
        <h3>📱 分享请柬</h3>
        <button class="modal-close" onclick="closeShareQRModal()">×</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--color-gray); font-size: 0.875rem; margin-bottom: 1rem;">
          扫描二维码即可查看婚礼请柬
        </p>
        <div id="shareQRCode" style="display: flex; justify-content: center; margin: 1rem 0;"></div>
        <p style="color: var(--color-gray); font-size: 0.75rem; margin-top: 1rem;">
          或使用下方按钮复制链接分享给亲友
        </p>
        <button class="btn btn-primary" style="margin-top: 1rem;" onclick="ExportManager.copyShareLink(); closeShareQRModal();">
          🔗 复制链接
        </button>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/export.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // 婚书页面特定初始化
    document.addEventListener('DOMContentLoaded', async () => {
      // 等待配置加载
      await window.ConfigManager.loadConfig();
      const config = window.ConfigManager.getConfig();

      // 渲染婚书文案列表
      renderWishList(config.marriageWishes);

      // 渲染预览
      window.renderInvitationPreview();
    });

    function closeShareQRModal() {
      document.getElementById('shareQRModal').classList.remove('active');
    }

    // 点击弹窗外部关闭
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
      }
    });

    // 渲染婚书文案列表
    function renderWishList(wishes) {
      const container = document.getElementById('wishList');
      if (!container || !wishes) return;
      
      container.innerHTML = wishes.map((wish, index) => `
        <div class="wish-item ${index === 0 ? 'selected' : ''}" data-index="${index}">
          <div class="wish-title">${wish.title}</div>
          <div class="wish-content">${wish.content}</div>
        </div>
      `).join('');
      
      // 绑定点击事件
      container.querySelectorAll('.wish-item').forEach(item => {
        item.addEventListener('click', () => {
          container.querySelectorAll('.wish-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          window.AppState.selectedWish = parseInt(item.dataset.index);
          window.renderInvitationPreview();
        });
      });
    }
  </script>
</body>
</html>
