<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流程时间线 - 甜囍手册</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="page-container">
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-content">
        <button class="header-back" onclick="history.back()">←</button>
        <div class="header-title">
          <span>⏰</span>
          <span>流程时间线</span>
        </div>
        <div style="width: 40px;"></div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
      <!-- 日期标题 -->
      <div class="card" style="margin-bottom: 1.5rem; text-align: center; background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); color: white;">
        <div class="card-body" style="padding: 1.5rem;">
          <div style="font-size: 1.5rem; font-weight: 600;">📅 2026年11月14日</div>
          <div style="opacity: 0.9; margin-top: 0.25rem;">婚礼当天流程安排</div>
        </div>
      </div>

      <!-- 角色筛选 -->
      <section>
        <label class="editor-label">👤 角色筛选</label>
        <div class="role-filter" id="roleFilter">
          <!-- 由JS动态渲染 -->
        </div>
      </section>

      <!-- 时间线 -->
      <section>
        <div class="timeline-container" id="timelineContainer">
          <!-- 由JS动态渲染 -->
          <div style="text-align: center; padding: 2rem; color: #999;">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">⏰</div>
            <div>加载中...</div>
          </div>
        </div>
      </section>

      <!-- 图例说明 -->
      <section class="card" style="margin-top: 1.5rem;">
        <div class="card-body">
          <h3 class="card-title" style="color: var(--color-gold);">📋 图例说明</h3>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-top: 1rem; font-size: 0.875rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span>🏠</span>
              <span style="color: var(--color-gray);">新郎家</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span>🏨</span>
              <span style="color: var(--color-gray);">接亲酒店</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span>⛪</span>
              <span style="color: var(--color-gray);">婚礼大堂</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span>🍽️</span>
              <span style="color: var(--color-gray);">宴会厅</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 重要提醒 -->
      <section class="card" style="margin-top: 1rem;">
        <div class="card-body">
          <h3 class="card-title" style="color: var(--color-primary);">⚠️ 重要提醒</h3>
          <ul style="margin-top: 1rem; color: var(--color-gray); font-size: 0.875rem; padding-left: 1.25rem;">
            <li style="margin-bottom: 0.5rem;">请务必按照时间节点准时到达各场地</li>
            <li style="margin-bottom: 0.5rem;">接亲游戏环节请配合伴娘团</li>
            <li style="margin-bottom: 0.5rem;">敬酒环节注意控制时间，不要贪杯哦~</li>
            <li>如有任何问题，请随时联系伴郎伴娘</li>
          </ul>
        </div>
      </section>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>首页</span>
      </a>
      <a href="invitation.html" class="nav-item">
        <span class="nav-icon">📜</span>
        <span>请柬</span>
      </a>
      <a href="route.html" class="nav-item">
        <span class="nav-icon">🗺️</span>
        <span>路书</span>
      </a>
      <a href="guests.html" class="nav-item">
        <span class="nav-icon">👥</span>
        <span>宾客</span>
      </a>
      <a href="timeline.html" class="nav-item active">
        <span class="nav-icon">⏰</span>
        <span>时间线</span>
      </a>
    </nav>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
